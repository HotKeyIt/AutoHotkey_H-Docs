<h1>ErrorMessage() <span class="ver">[AHK_H]</span></h1>
<p>Retrieve the error message from <a href="https://msdn.microsoft.com/en-us/library/windows/desktop/ms681381.aspx">system message table</a> resources.</p>
<pre class="Syntax">OutputVar := <span class="func">ErrorMessage</span>(<span class="optional">MessageId</span>)</pre>

<h2 id="Parameters">Parameters</h2>
<dl>
  <dt>MessageID (optional)</dt>
    <dd><p>The message identifier (A_LastError).</p>
    </dd>
</dl>

<h2 id="Return_Value">Return Value</h2>
<p>This function returns the error message.</p>
<h2 id="Examples">Examples</h2>
<div class="ex" id="ExBasic">
<p><a class="ex_number" href="#ExBasic"></a> </p>
<pre>MsgBox % ErrorMessage(87)</pre>
</div>
