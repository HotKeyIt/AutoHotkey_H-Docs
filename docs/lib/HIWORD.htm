<h1>HIWORD() <span class="ver">[AHK_H]</span></h1>
<p>Retrieves the high-order word from the given value.</p>
<pre class="Syntax">OutputVar := <span class="func">HIWORD</span>(Value)</pre>
<h2 id="Parameters">Parameters</h2>
<dl>
<dt>Value</dt>
<dd>
<p>The value to convert to high-order word.</p>
</dd>
</dl>

<h2 id="Return_Value">Return Value</h2>
<p>This function returns the high-order word.</p>
<h2 id="Examples">Examples</h2>
<div class="ex" id="ExBasic">
<p><a class="ex_number" href="#ExBasic"></a> </p>
<pre>var:=1310730
MsgBox % HIWORD(var)</pre>
