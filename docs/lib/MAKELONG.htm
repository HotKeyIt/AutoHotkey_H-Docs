<h1>MAKELONG() <span class="ver">[AHK_H]</span></h1>
<p>Creates a LONG value by concatenating the specified values.</p>
<pre class="Syntax">OutputVar := <span class="func">MAKELONG</span>(ValueLow, ValueHigh)</pre>
<h2 id="Parameters">Parameters</h2>
<dl>
<dt>ValueLow</dt>
<dd>
<p>The low-order value.</p>
</dd>
<dt>ValueHigh</dt>
<dd>
<p>The high-order value.</p>
</dd>
</dl>

<h2 id="Return_Value">Return Value</h2>
<p>This function returns the LONG value.</p>
<h2 id="Examples">Examples</h2>
<div class="ex" id="ExBasic">
<p><a class="ex_number" href="#ExBasic"></a> </p>
<pre>MsgBox % MakeLong(10, 20)</pre>
